<app-navbar></app-navbar>

<main style="min-height: 80vh;">
  <router-outlet></router-outlet>
</main>

<!-- Carrito Nuevo -->
@if (mostrarCarrito) {
  <app-cart 
    (close)="cerrarCarrito()" 
    (openCheckout)="abrirCheckout()">
  </app-cart>
}

<!-- Comprobante / Boleta -->
@if (mostrarCheckout) {
  <app-checkout 
    [items]="itemsCarrito"
    [total]="totalCarrito"
    (close)="cerrarCheckout()">
  </app-checkout>
}

<app-footer></app-footer>
