<div class="catalog-container">
  <div class="catalog-header">
    <h2>Catálogo Completo</h2>
    <span class="product-count">{{ productos.length || 0 }} productos encontrados</span>
  </div>
  
  <div class="products-grid">
    @for (producto of productos; track producto.id) {
      <div class="product-card">
        <!-- Badge o Etiqueta superior opcional -->
        <div class="card-badge">Nuevo</div>
        
        <!-- Imagen con contenedor para efecto zoom -->
        <div class="image-container">
          <img [src]="producto.imagen || 'assets/placeholder.jpg'" [alt]="producto.nombre">
        </div>
        
        <!-- Contenido de la tarjeta -->
        <div class="card-body">
          <span class="brand-tag">{{ producto.marca }}</span>
          <h3 class="product-title">{{ producto.nombre }}</h3>
          <p class="category-tag">{{ producto.categoria }}</p>
          <p class="product-price">S/ {{ producto.precio }}</p>
          
          <button class="btn-add-cart">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="cart-icon"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
            AGREGAR AL CARRITO
          </button>
        </div>
      </div>
    }
  </div>
</div>
